services:
  service1:
    build:
      context: ./service    
    environment:
      - NODE_ENV=production 
      - SERVICE2_URL=http://service2:8299 
    ports:
      - "8199"
    deploy:
      replicas: 3         
    networks:
      - service_network     

  service2:
    build:
      context: ./service2   # Path to the service2 directory where the Dockerfile is located
    expose:
      - "8299"              # Exposes port 8299 internally to other services in the network
    networks:
      - service_network     # Connects to the same service network as service1
    container_name: service2

  ngingx:
    build: ./nginx
    ports:
      - "8081:80" # Maps port 8081 on the host to port 80 on the container
    networks:
      - service_network
    container_name: nginx
    depends_on:
      - service1
      - service2

  control_service:
    build: ./control_server
    ports:
      - "5000"
    volumes:
      - /var/run/docker.sock:/var/run/custom.sock
    networks:
      - service_network
    container_name: controller

networks:
  service_network:
    driver: bridge           # Creates a custom bridge network
