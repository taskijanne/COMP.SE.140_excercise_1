<!-- This is the frontend of the application, including the GUI elements such as buttons and text field for displaying data fetched from the service-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>
</head>
<body>
    <h1>Welcome!</h1>
    <button id="startButton">START</button>
    <button id="pauseButton">PAUSE</button>
    <button id="requestButton">REQUEST</button>
    <button id="logsButton">GET LOGS</button>
    <pre id="message"></pre>
    <script>

        function sendHTTPRequest(URL, method = "GET", body = null) {
            return fetch(URL, {
                method: method,
                body: body
            }).then(response => {
                if (!response.ok) {
                    throw new Error(response.statusText);
                }
                return response.text();
            });
        }

        const messageField = document.getElementById('message');

        document.getElementById('startButton').addEventListener('click', function() {
            sendHTTPRequest('/api/state', 'PUT', 'RUNNING')
            .then(data => messageField.textContent = data)
                .catch(error => messageField.textContent = error);
        });

        document.getElementById('pauseButton').addEventListener('click', function() {
            sendHTTPRequest('/api/state', 'PUT', 'PAUSED')
                .then(data => messageField.textContent = data)
                .catch(error => messageField.textContent = error);
        });

        document.getElementById('requestButton').addEventListener('click', function() {
            sendHTTPRequest('/api/request')
                .then(data => messageField.textContent = data)
                .catch(error => messageField.textContent = error);
        });

        document.getElementById('logsButton').addEventListener('click', function() {
            sendHTTPRequest('/api/run-log')
                .then(data => messageField.textContent = data)
                .catch(error => messageField.textContent = error);
        });
    </script>
</body>
</html>
