stages:
  - build
  - test

# Build stage
build:
  stage: build
  script:
    - echo "Starting the build process"
    - docker compose build
  only:
    - project

# Test stage
test:
  stage: test
  script:
    - echo "Running tests"
    - docker compose up -d
    #- docker compose exec <service-name> npm test  # Replace with your test command
    - docker compose down
  only:
    - project
