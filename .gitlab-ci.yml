stages:
  - build
  - test
  - deploy

# Tag names for the container images. Used in build stage to tag the images and in deploy stage to pull the images.
variables:
  NGINX_IMAGE: $CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_SHORT_SHA
  CONTROL_SERVICE_IMAGE: $CI_REGISTRY_IMAGE/control_service:$CI_COMMIT_SHORT_SHA
  SERVICE1_IMAGE: $CI_REGISTRY_IMAGE/service1:$CI_COMMIT_SHORT_SHA
  SERVICE2_IMAGE: $CI_REGISTRY_IMAGE/service2:$CI_COMMIT_SHORT_SHA
  API_GATEWAY_IMAGE: $CI_REGISTRY_IMAGE/api_gateway:$CI_COMMIT_SHORT_SHA

# Build stage: Builds the Docker images and pushes them to GitLab Container Registry
build:
  stage: build
  image: docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""  # Disable TLS for Docker-in-Docker
    DOCKER_HOST: "tcp://docker:2375"  # Connect to the Docker daemon provided by docker:dind
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  services:
    - docker:dind
  script:
    - echo "Starting the build process"
    - docker --version
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker compose build
    - docker compose push   
  only:
    - project

# Test stage: Builds the test image and runs the tests. Tests are run in a separate container which is not part of the Docker Compose network
test:
  stage: test
  variables:
    DOCKER_TLS_CERTDIR: ""  # Disable TLS for Docker-in-Docker
    DOCKER_HOST: "tcp://docker:2375"  # Connect to the Docker daemon provided by docker:dind
  services:
    - docker:dind
  script:
    - echo "Running tests"
    - docker compose up -d
    - sleep 5
    - docker build -t test-project ./tests
    - docker run --rm --network host test-project
    - docker compose down
  only:
    - project

# Deploy stage:
# 1) Transfers the docker-compose.yml file to the VM
# 2) Logs in to the GitLab Container Registry
# 3) Sets the environment variables for the images (the environment variables are defined also in the docker-compose.yml file)
# 4) Pulls the images from the GitLab Container Registry
# 5) Starts the application with docker compose
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/key.pem
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/key.pem
    - ssh-keyscan -H 128.214.254.140 >> ~/.ssh/known_hosts
  script:
    - echo "Transferring docker-compose.yml to the VM"
    - scp -i ~/.ssh/key.pem docker-compose.yml ubuntu@128.214.254.140:/home/ubuntu/
    - echo "Starting deployment on the VM"
    - |
      ssh -i ~/.ssh/key.pem ubuntu@128.214.254.140 << EOF
      docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
      export NGINX_IMAGE=${NGINX_IMAGE}
      export CONTROL_SERVICE_IMAGE=${CONTROL_SERVICE_IMAGE}
      export SERVICE1_IMAGE=${SERVICE1_IMAGE}
      export SERVICE2_IMAGE=${SERVICE2_IMAGE}
      export API_GATEWAY_IMAGE=${API_GATEWAY_IMAGE}
      docker compose pull
      docker compose up -d
      exit
      EOF 
  only:
    - project