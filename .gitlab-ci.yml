stages:
  - build
  - test

# Build stage
build:
  stage: build
  image: docker:latest
  variables:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" 
    DOCKER_HOST: "unix:///var/run/docker.sock"
    #services:
   # - docker:dind
  script:
    - echo "Starting the build process"
    - docker --version
    - echo $PATH
    - docker compose build
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  only:
    - project

# Test stage
test:
  stage: test
  script:
    - echo "Running tests"
    - docker compose up -d
    #- docker compose exec <service-name> npm test  # Replace with your test command
    - docker compose down
  only:
    - project
